<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELIOS-easytime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="topbar">
            <span class="topbar-title">HELIOS-easytime</span>
            <span class="topbar-sep">|</span>
            <button class="topbar-btn" id="btnFreeze">FREEZE</button>
            <span class="topbar-sep">|</span>
            <label class="topbar-label">SPEED</label>
            <input type="range" id="speedSlider" min="0.1" max="5" step="0.5" value="2" class="topbar-slider">
            <span class="topbar-val" id="speedValue">2x</span>
            <span class="topbar-sep">|</span>
            <label class="topbar-label">TIME</label>
            <input type="range" id="hourSlider" min="0" max="23" step="1" value="8" class="topbar-slider hour-slider">
            <span class="topbar-val" id="timeDisplay">08:00</span>
            <input type="range" id="minuteSlider" min="0" max="59" step="5" value="0" class="topbar-slider minute-slider">
            <button class="topbar-btn small" id="btnToggleFormat">24H</button>
            <span class="topbar-sep">|</span>
            <button class="topbar-btn close" id="btnClose">X</button>
        </div>

        <div class="weather-section">
            <div class="weather-current" id="currentWeatherDisplay">
                <div class="weather-current-icon" id="currentWeatherIcon"></div>
                <div class="weather-current-info">
                    <div class="weather-current-label">CURRENT WEATHER</div>
                    <div class="weather-current-value" id="currentWeatherValue">CLEAR</div>
                </div>
            </div>
            <div class="weather-grid" id="weatherGrid"></div>
        </div>

        <div class="bottom-bar">
            <span class="pending-dot" id="pendingDot"></span>
            <span class="pending-text" id="pendingText"></span>
            <button class="bottom-btn primary" id="btnApply">APPLY</button>
            <button class="bottom-btn" id="btnApplyClose">APPLY & CLOSE</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
